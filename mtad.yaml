_schema-version: "3.2"
ID: inoxgfl-vendor-portal
description: A Fiori-like Vendor Portal for SAP BTP
version: 1.0.0
modules:
- name: inoxgfl-approuter
  type: javascript.nodejs
  path: inoxgfl-approuter
  requires:
  - name: inoxgfl-xsuaa
  - name: inoxgfl-destination
  - name: srv-api
    group: destinations
    properties:
      forwardAuthToken: true
      name: srv-api
      url: ~{url}
  parameters:
    disk-quota: 256M
    memory: 256M
- name: inoxgfl-backend
  type: javascript.nodejs
  path: inoxgfl-backend
  requires:
  - name: inoxgfl-xsuaa
  - name: inoxgfl-destination
  - name: inoxgfl-connectivity
  provides:
  - name: srv-api
    properties:
      url: ${default-url}
resources:
- name: inoxgfl-xsuaa
  type: org.cloudfoundry.managed-service
  parameters:
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: inoxgfl-destination
  type: org.cloudfoundry.managed-service
  parameters:
    service: destination
    service-plan: lite
- name: inoxgfl-connectivity
  type: org.cloudfoundry.managed-service
  parameters:
    service: connectivity
    service-plan: lite
parameters:
  enable-parallel-deployments: true
